schema = "opendap.requirements/v1"

[[block]]
markdown = "# Powerbank HAT requirements\n\nRequirements for this project.\n"

[[block]]
[[block.requirement]]
id = "PWR-001"
text = "This HAT is a complete project: hardware, case, firmware, software, Blackbird OS package and its own tooling."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "PWR-002"
text = "Its Blackbird OS software shall be a custom implementation built on popular open-source software for its domain, optimized for this HAT and the board."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "PWR-003"
text = "It shall mount through the OpenDAP HAT Standard."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "PWR-004"
text = "It may include on-board AI features."
priority = "should"
status = "draft"
[[block.requirement]]
id = "PWR-005"
text = "The HAT shall work as a powerbank."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "PWR-006"
text = "The HAT shall reach the device only through its USB port and meet the minimum conditions of [hat-standard interface v2](https://github.com/opendap-project/hats/blob/main/standard/docs/specs/interface-v2.md) (HCS-027 to HCS-031): standard USB classes, the identity capability, USB PD power rules, firmware recoverable over USB."
priority = "must"
status = "draft"
[[block.requirement]]
id = "PWR-007"
text = "The HAT shall be a USB PD source or dual-role HAT, report its battery over PD, and keep the device as USB host."
priority = "must"
status = "draft"

[[block]]
markdown = ""
