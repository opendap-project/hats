schema = "opendap.requirements/v1"

[[block]]
markdown = "# HAT Case Standard requirements\n\nRequirements for the HAT Case Standard.\n"

[[block]]
[[block.requirement]]
id = "HCS-001"
text = "The standard shall cover both sides of the HAT Case: the device (T1) side and the accessory side."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-002"
text = "The standard shall be usable by third-party accessory developers."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-003"
text = "A HAT shall replace the basic back cover of the core with a HAT case."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-004"
text = "Each exposed high-speed interface (PCIe, USB, camera, …) shall target the theoretical maximum the hardware and software can deliver, with no cap set up front. Actual speeds are measured at the end."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-005"
text = "Any compromise on the exposed ports shall be fully justified."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-006"
text = "The HAT interface shall use a single interconnect type for every signal: either all pogo pins or all connectors, ideally of the same part."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-007"
text = "A HAT shall identify itself through an on-board EEPROM."
priority = "must"
status = "withdrawn"
note = "identity is carried in USB descriptors, HCS-029"
[[block.requirement]]
id = "HCS-008"
text = "There shall be no central registry of manufacturer or vendor IDs."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-009"
text = "The EEPROM shall carry a capability manifest in a standard schema."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-010"
text = "The capability manifest shall be signed, and Blackbird OS shall verify it."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-011"
text = "The capability manifest shall work with the Blackbird OS package repository mechanism (reverse-domain, well-known HTTP, through the package endpoint)."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-012"
text = "The device-side piece shall be fixed to the T1; only the HAT is swapped."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-013"
text = "The standard shall support HATs carrying microcontrollers, FPGAs or another SoC, which Blackbird OS can flash, operate and debug."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-014"
text = "HATs shall be passive at the interface: flat contact pads on the HAT, springs only on the device side."
priority = "must"
status = "draft"
[[block.requirement]]
id = "HCS-015"
text = "Power classes: A and B (the HAT draws power) and F (the HAT is a power source)."
priority = "must"
status = "withdrawn"
note = "power roles and levels follow USB PD, HCS-030"
[[block.requirement]]
id = "HCS-016"
text = "Power-up sequence: presence detect → 3.3 V → read EEPROM → apply overlay → 5 V → switches and high-speed links."
priority = "must"
status = "withdrawn"
[[block.requirement]]
id = "HCS-017"
text = "The EEPROM shall use the OpenDAP HAT identity format: reverse-domain ID, power class, Ed25519 signature and the hash of the capability manifest."
priority = "must"
status = "withdrawn"
note = "no EEPROM; the identity record is read over USB, HCS-029"
[[block.requirement]]
id = "HCS-018"
text = "The device-side piece shall be fixed with four M2 screws, and a spring-loaded steel slider lock shall hold the HAT, released by a button on the right edge."
priority = "should"
status = "withdrawn"
[[block.requirement]]
id = "HCS-019"
text = "The lock may use a metal part, as the exception to polymer-first cases."
priority = "should"
status = "confirmed"
[[block.requirement]]
id = "HCS-020"
text = "The device-side piece of the HAT case shall be screwed to the T1."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-021"
text = "The standard shall be hardware-agnostic on both sides: it shall not depend on the board or SoC behind the device side, nor on the HAT's hardware, and shall stay valid if the device's board changes completely. Signals are defined by function and interface class, never by a specific SoC pin."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-022"
text = "The interface shall keep a few reserved contacts for future revisions, without displacing essential signals to get them."
priority = "must"
status = "withdrawn"
note = "no reserved contacts; growth comes through USB, HCS-028"
[[block.requirement]]
id = "HCS-023"
text = "The device-side piece (pogo field and its flat cable) shall be an independent accessory of the HAT standard, fitted to the T1 by the user or at assembly and then fixed to it (HCS-012, HCS-020). A T1 without it works fully, and the back cover closes it."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-024"
text = "The HAT standard is OpenDAP's own. It takes inspiration from established standards (Raspberry Pi HAT+ and others) and should support them where that costs little, for example by keeping the identity layout compatible with HAT+ so existing tools can read it."
priority = "should"
status = "confirmed"
[[block.requirement]]
id = "HCS-025"
text = "The standard shall define compatibility levels (L1 Core, L2 Control and audio, L3 High-speed extension): devices declare the level they implement, HATs the level they need, and a HAT works on any device of its level or higher (ADR 0003, ADR 0005)."
priority = "must"
status = "withdrawn"
note = "no compatibility levels, HCS-028"
[[block.requirement]]
id = "HCS-026"
text = "USB 3 shall be the base of the HAT interface (L1). The high-speed extension shall carry PCIe or MIPI CSI-2 (camera in) on the same reused contacts, selected by the function the HAT declares in its identity record, not both side by side."
priority = "must"
status = "withdrawn"
note = "no PCIe or CSI-2 extension; USB only, HCS-027"
[[block.requirement]]
id = "HCS-027"
text = "Every HAT capability shall go through USB, using standard USB device classes or a vendor class whose host side is Open Source. A HAT that needs more shall carry its own processing behind its USB port."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-028"
text = "The HAT connector shall carry only what USB defines: SuperSpeed TX and RX, the USB 2.0 pair, VBUS and GND (repeated only as current and signal integrity require), and CC. No other signal, no reserved contacts and no compatibility levels."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-029"
text = "A HAT shall identify itself through its USB descriptors, which lead to its signed capability manifest. Presence shall be USB attach, and wake shall be USB remote wakeup."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-030"
text = "Charging and voltage management on the HAT interface shall follow USB Power Delivery: power roles (sink, source, dual-role), current and voltage are negotiated on CC, within each side's capability and the BRD-049 margins."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "HCS-031"
text = "Every HAT shall meet the minimum conditions of the HAT interface: standard USB classes, its own processing, the identity capability, the USB power rules, and firmware that can be recovered over USB with no working application firmware."
priority = "must"
status = "draft"
[[block.requirement]]
id = "HCS-032"
text = "The standard shall include a blank HAT case: a HAT case with no HAT hardware that closes the back of a T1 fitted with the device-side piece when no HAT is attached. It is separate from the hardware HATs."
priority = "must"
status = "confirmed"

[[block]]
markdown = "\n## Open questions\n\n- The [HAT interface v2](../specs/interface-v2.md) (Draft, [ADR 0006](../adr/0006-hats-are-usb-only.md)) defines 20 contacts on a 2 × 10 pogo field. The pad map freezes after the signal-integrity coupon (ADR 0004). Open: the identity capability's UUID and byte layout, voltage ratings above 5 V for the pogo part, remote wakeup from each device's suspend, and the conformance suite.\n- Mechanical details of the device-side piece and the HAT case.\n\n## Context\n\n- HCS-017 and HCS-024: the standard is OpenDAP's own; compatibility with Raspberry Pi HAT+ and other standards is a *should*, not a constraint.\n- HCS-022 is must: contacts cannot be added once third parties build HATs.\n- The connection from the board to a HAT has two stages: a flat cable from the board to the device-side piece of the HAT case, then from that piece to the HAT hardware.\n- The second stage is all pogo pins ([ADR 0001](../adr/0001-all-pogo-interface-with-fixed-device-side-piece.md)). An early estimate was about 120–128 contacts; two rows would be about 81 mm long, more than the device width, so the first proposal was a 4 × 32 grid at 1.27 mm (about 41 × 4 mm). Note: superseded. Interface v1 reduced the count, the ADR 0002 amendment set a 4 × 25 = 100 field, and [ADR 0004](../adr/0004-pogo-part-and-field-geometry.md) fixes it at 2.54 mm along the body's length with Harwin P70 springs and Mill-Max 0965 as the second source; the pinout is in [interface v1](../specs/interface-v1.md). Note (ADR 0005): the field is now 4 × 17 = 68 at 2.54 mm.\n- HCS-026: contacts were already reduced through the compatibility levels and pin reuse, yet the design still used too many in places; the base is USB 3, and the extension is PCIe or CSI-2 on the same reused high-speed contacts, selected by declared function (DSI out is not part of it). They also clarified board BRD-042: a standard high-speed switch is acceptable if it does not limit the link and uses standard parts and protocols. Result: [ADR 0005](../adr/0005-interface-v1-1-shared-extension-and-contact-reduction.md): 100 → 68 pogo contacts (L1 29, L2 45, L3 68 cumulative), one DF40 100 per cable end instead of a 100 and a 50, line out removed, SWD as a GPIO alternate.\n- HCS-007 requires an on-board EEPROM; the dedicated ID bus comes from ADR 0002 item 2. ADR 0005 keeps it: moving the EEPROM onto the general I2C would save two contacts but make the identity read, which gates `HAT_5V`, depend on every third-party device on that bus.\n- The flat cable from the board to the device-side piece is specified by the `board` repository.\n- The device-side piece goes wherever it fits best inside the T1. The HAT Case Standard is defined once the rest of the device is settled.\n- HCS-027 to HCS-030: HATs are USB only; the connector carries only what USB defines, with identity in USB descriptors, presence as attach and wake as remote wakeup; charging and voltage management follow USB Power Delivery, so CC is part of the connector. Result: [ADR 0006](../adr/0006-hats-are-usb-only.md) and [interface v2](../specs/interface-v2.md): 68 → 20 pogo contacts. Withdrawn the same day: HCS-007, HCS-015, HCS-017, HCS-022, HCS-025, HCS-026. HCS-013 stands: HAT chips are flashed, operated and debugged over USB. HCS-024 stands; its example (an identity layout readable by HAT+ tools) no longer applies, as there is no EEPROM. HCS-031 (Draft) records the minimum conditions of interface v2 §8.\n- HCS-006, HCS-014 ([RFC 0015](https://github.com/opendap-project/rfcs/blob/main/text/0015-hat-connector-pogo-field-and-usb-c-port-hat.md)): the pogo field stays the HAT connector of interface v2 ([ADR 0001](../adr/0001-all-pogo-interface-with-fixed-device-side-piece.md) confirmed); the Mill-Max 0965 becomes the primary pogo part and the Harwin P70 the alternate ([ADR 0004](../adr/0004-pogo-part-and-field-geometry.md) amendment). A USB-C port is offered as a reference HAT, the USB-C port HAT ([reference designs](../../reference-designs/README.md)), also the prototyping path for HAT makers (HCS-002).\n- HCS-032: three back closures exist: the basic back cover (no device-side piece, HCS-023), the blank HAT case (device-side piece fitted, no HAT) and a hardware HAT in its HAT case (HCS-003).\n"
