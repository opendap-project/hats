# Local checks for every commit. Install once per clone: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5120"]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: https://github.com/opendap-project/toolkit-hooks
    rev: v0.4.1
    hooks:
      - id: no-stray-files
      - id: kicad-erc
      - id: kicad-drc
      - id: no-fab-outputs
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
  # The requirements README is rendered from requirements.toml and checked.
  - repo: local
    hooks:
      - id: requirements-current
        name: requirements README rendered (odapkit req render --check)
        entry: odapkit req render docs/requirements/requirements.toml --check
        language: system
        pass_filenames: false
        files: ^docs/requirements/
      # The interface v2 tables are generated from interfaces/hat-v2/ and checked; the generator is tested.
      - id: hat-interface-current
        name: interface v2 tables generated (tools/hat_interface.py render --check)
        entry: python tools/hat_interface.py render --check
        language: python
        additional_dependencies: ["jsonschema==4.23.0"]
        pass_filenames: false
        files: ^(interfaces/|tools/|docs/specs/interface-v2\.md$)
      - id: hat-interface-tests
        name: hat_interface tests (pytest)
        entry: pytest -q tests
        language: python
        additional_dependencies: ["jsonschema==4.23.0", "pytest==8.3.3"]
        pass_filenames: false
        files: ^(interfaces/|tools/|tests/|docs/specs/interface-v2\.md$)
